[package]
name = "m-bus-parser-c"
version = "0.7.4"
edition = "2021"
description = "C bindings for the M-Bus parser"
license = "MIT"
repository = "https://github.com/maebli/m-bus-parser"
publish = false

[lib]
name = "mbus_parser"
crate-type = ["cdylib", "staticlib"]

[features]
default = ["decryption"]
decryption = ["m-bus-parser/decryption"]
oms-gen2 = ["m-bus-parser/oms-gen2"]
oms-gen3 = ["m-bus-parser/oms-gen3"]
oms-gen4-0 = ["m-bus-parser/oms-gen4-0"]
oms-gen4-1 = ["m-bus-parser/oms-gen4-1"]
oms-gen4-2 = ["m-bus-parser/oms-gen4-2"]
oms-gen4-3 = ["m-bus-parser/oms-gen4-3"]
oms-gen4-4 = ["m-bus-parser/oms-gen4-4"]
oms-gen4-5 = ["m-bus-parser/oms-gen4-5"]
oms-gen4 = ["m-bus-parser/oms-gen4"]
oms-gen5 = ["m-bus-parser/oms-gen5"]

[dependencies]
m-bus-parser = { path = "..", version = "0.7.4", features = ["std", "serde"] }
serde_json = "1.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "allow"
