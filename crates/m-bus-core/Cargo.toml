[package]
name = "m-bus-core"
version = "0.6.1"
edition = "2024"
description = "Core types for the m-bus-parser M-Bus protocol library"
license = "MIT"
repository = "https://github.com/maebli/m-bus-parser"

[features]
default = []
std = []
serde = ["dep:serde","std"]
defmt = ["dep:defmt"]
decryption = ["decryption-mode-5", "decryption-mode-7", "decryption-mode-10"]
decryption-api = []
decryption-mode-5 = ["decryption-api", "dep:aes", "dep:cbc", "dep:cipher"]
decryption-mode-7 = ["decryption-api", "dep:aes", "dep:cbc", "dep:cipher"]
decryption-mode-10 = ["decryption-api", "dep:aes", "dep:ccm", "dep:cmac"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
defmt = { version = "1.0.1", optional = true }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", optional = true }
cipher = { version = "0.5", optional = true, features = ["block-padding"] }
ccm = { version = "0.6", optional = true, default-features = false }
cmac = { version = "0.8", optional = true, default-features = false }
