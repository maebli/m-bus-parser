[package]
name = "m-bus-oms-rules"
version = "0.7.4"
edition = "2024"
description = "OMS telegram rule checks for M-Bus"
license = "MIT"
repository = "https://github.com/maebli/m-bus-parser"

[features]
dlms = ["dep:m-bus-application-layer"]
serde = ["dep:serde"]

[dependencies]
m-bus-application-layer = { version = "0.7.4", path = "../m-bus-application-layer", optional = true, features = ["dlms-cosem"] }
m-bus-core = { version = "0.7.4", path = "../m-bus-core" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
