<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=yes" />
    <style>
      html {
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #fff;
        font-size: 16px;
      }
      body {
        color: #4a4a4a;
        margin: 8px;
        font-size: 1em;
        font-weight: 400;
      }
      header {
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
      }
      main {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      a {
        color: #3273dc;
        cursor: pointer;
        text-decoration: none;
      }
      a:hover {
        color: #000;
      }
      button {
        color: #fff;
        background-color: #3298dc;
        border-color: transparent;
        cursor: pointer;
        text-align: center;
      }
      button:hover {
        background-color: #2793da;
        flex: none;
      }
      .spacer {
        flex: auto;
      }
      .small {
        font-size: 0.75rem;
      }
      footer {
        margin-top: 16px;
        display: flex;
        align-items: center;
      }
      .header-label {
        margin-right: 4px;
      }
      .benchmark-set {
        margin: 8px 0;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .benchmark-title {
        font-size: 3rem;
        font-weight: 600;
        word-break: break-word;
        text-align: center;
      }
      .benchmark-graphs {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        width: 100%;
      }
      .benchmark-chart {
        max-width: 1000px;
      }
    </style>
    <title>Benchmarks</title>
  </head>

  <body>
    <header id="header">
      <div class="header-item">
        <strong class="header-label">Last Update:</strong>
        <span id="last-update"></span>
      </div>
      <div class="header-item">
        <strong class="header-label">Repository:</strong>
        <a id="repository-link" rel="noopener"></a>
      </div>
    </header>
    <p>Optimization charts compare Size (z), Size (s), and Speed (3) on the same
      fixture. Latency is measured on the native host; flash and static RAM are
      measured for Thumb. Static RAM excludes stack and heap.</p>
    <main id="main"></main>
    <footer>
      <button id="dl-button">Download data as JSON</button>
      <div class="spacer"></div>
      <div class="small">Powered by <a rel="noopener" href="https://github.com/marketplace/actions/continuous-benchmark">github-action-benchmark</a></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.2/dist/Chart.min.js"></script>
    <script src="data.js"></script>
    <script src="tags.js"></script>
    <script id="main-script">
      'use strict';
      (function() {
        const releaseColor = '#7d4fd1';

        // Colors from https://github.com/github/linguist/blob/master/lib/linguist/languages.yml
        const toolColors = {
          cargo: '#dea584',
          go: '#00add8',
          benchmarkjs: '#f1e05a',
          benchmarkluau: '#000080',
          pytest: '#3572a5',
          googlecpp: '#f34b7d',
          catch2: '#f34b7d',
          julia: '#a270ba',
          jmh: '#b07219',
          benchmarkdotnet: '#178600',
          customBiggerIsBetter: '#38ff38',
          customSmallerIsBetter: '#ff3838',
          _: '#333333'
        };

        function init() {
          function collectBenchesPerTestCase(entries) {
            const map = new Map();
            for (const entry of entries) {
              const {commit, date, tool, benches} = entry;
              for (const bench of benches) {
                const result = { commit, date, tool, bench };
                // Optimization variants share a chart, while legacy metrics
                // keep their existing single-series charts.
                const match = bench.name.match(/^(.*) \[opt-level=(z|s|3)\]$/);
                const name = match ? match[1] : bench.name;
                const variant = match ? match[2] : 'default';
                if (!map.has(name)) map.set(name, new Map());
                const series = map.get(name);
                if (!series.has(variant)) series.set(variant, []);
                series.get(variant).push(result);
              }
            }
            return map;
          }

          const data = window.BENCHMARK_DATA;

          // Render header
          document.getElementById('last-update').textContent = new Date(data.lastUpdate).toString();
          const repoLink = document.getElementById('repository-link');
          repoLink.href = data.repoUrl;
          repoLink.textContent = data.repoUrl;

          // Render footer
          document.getElementById('dl-button').onclick = () => {
            const dataUrl = 'data:,' + JSON.stringify(data, null, 2);
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'benchmark_data.json';
            a.click();
          };

          // Prepare data points for charts
          return Object.keys(data.entries).map(name => ({
            name,
            dataSet: collectBenchesPerTestCase(data.entries[name]),
          }));
        }

        function renderAllChars(dataSets) {

          function renderGraph(parent, name, variants, setName) {
            const canvas = document.createElement('canvas');
            canvas.className = 'benchmark-chart';
            parent.appendChild(canvas);

            const profileColors = {z: '#3273dc', s: '#159957', '3': '#d17a00'};
            const profileLabels = {z: 'Size (z)', s: 'Size (s)', '3': 'Speed (3)'};
            const series = [...variants.entries()];
            // Align by run, not array position: older commits can lack variants.
            const pointKey = d => d.commit.id + ':' + d.date;
            const points = new Map();
            series.forEach(([, values]) => values.forEach(d => points.set(pointKey(d), d)));
            const dataset = [...points.values()].sort((a, b) => a.date - b.date);
            const aligned = series.map(([, values]) => {
              const byRun = new Map(values.map(d => [pointKey(d), d]));
              return dataset.map(d => byRun.get(pointKey(d)) || null);
            });
            const tagsByCommit = (window.BENCHMARK_TAGS || {})[setName] || {};
            const tagsAt = dataset.map(d => tagsByCommit[d.commit.id]);
            const tagged = tagsAt.some(Boolean);
            const pointAt = item => aligned[item.datasetIndex][item.index];
            const data = {
              labels: dataset.map(d => d.commit.id.slice(0, 7)),
              datasets: series.map(([variant, values], index) => {
                const color = profileColors[variant] || toolColors[values[0].tool] || toolColors._;
                return {
                  label: profileLabels[variant] || name,
                  data: aligned[index].map(d => d ? d.bench.value : null),
                  borderColor: color,
                  backgroundColor: color + '60',
                  fill: false,
                  spanGaps: false,
                  pointRadius: tagsAt.map(t => (t ? 5 : 3)),
                  pointHoverRadius: tagsAt.map(t => (t ? 7 : 5)),
                  pointBackgroundColor: tagsAt.map(t => (t ? releaseColor : color + '60')),
                };
              }),
            };
            const options = {
              title: {display: true, text: name},
              scales: {
                xAxes: [
                  {
                    scaleLabel: {
                      display: true,
                      labelString: 'commit',
                    },
                  }
                ],
                yAxes: [
                  {
                    scaleLabel: {
                      display: true,
                      labelString: dataset.length > 0 ? dataset[0].bench.unit : '',
                    },
                    ticks: {
                      beginAtZero: true,
                    }
                  }
                ],
              },
              tooltips: {
                callbacks: {
                  afterTitle: items => {
                    const {index} = items[0];
                    const data = pointAt(items[0]);
                    const names = tagsAt[index];
                    const release = names ? 'Release ' + names.join(', ') + '\n' : '';
                    return '\n' + release + data.commit.message + '\n\n' + data.commit.timestamp + ' committed by @' + data.commit.committer.username + '\n';
                  },
                  label: item => {
                    let label = data.datasets[item.datasetIndex].label + ": " + item.value;
                    const { range, unit } = pointAt(item).bench;
                    label += ' ' + unit;
                    if (range) {
                      label += ' (' + range + ')';
                    }
                    return label;
                  },
                  afterLabel: item => {
                    const { extra } = pointAt(item).bench;
                    return extra ? '\n' + extra : '';
                  }
                }
              },
              onClick: (_mouseEvent, activeElems) => {
                if (activeElems.length === 0) {
                  return;
                }
                // XXX: Undocumented. How can we know the index?
                const index = activeElems[0]._index;
                const point = aligned[activeElems[0]._datasetIndex][index];
                if (!point) return;
                const url = point.commit.url;
                window.open(url, '_blank');
              },
            };

            // Mark where each release shipped, so a step in the chart can be
            // read against the versions it falls between.
            const releaseMarkers = {
              afterDatasetsDraw(chart) {
                if (!tagged) {
                  return;
                }
                const xAxis = chart.scales['x-axis-0'];
                const {top, bottom} = chart.chartArea;
                const ctx = chart.ctx;
                ctx.save();
                ctx.font = '11px ' + window.getComputedStyle(document.documentElement).fontFamily;
                ctx.strokeStyle = releaseColor;
                ctx.fillStyle = releaseColor;
                ctx.lineWidth = 1;
                tagsAt.forEach((names, index) => {
                  if (!names) {
                    return;
                  }
                  const x = xAxis.getPixelForTick(index);
                  ctx.beginPath();
                  ctx.setLineDash([4, 4]);
                  ctx.moveTo(x, top);
                  ctx.lineTo(x, bottom);
                  ctx.stroke();
                  ctx.setLineDash([]);
                  const label = names.join(', ');
                  ctx.save();
                  ctx.translate(x + 4, top + 4);
                  ctx.rotate(Math.PI / 2);
                  ctx.textAlign = 'left';
                  ctx.textBaseline = 'middle';
                  // Keep the name readable where it crosses the plotted line.
                  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                  ctx.fillRect(-2, -7, ctx.measureText(label).width + 4, 14);
                  ctx.fillStyle = releaseColor;
                  ctx.fillText(label, 0, 0);
                  ctx.restore();
                });
                ctx.restore();
              },
            };

            new Chart(canvas, {
              type: 'line',
              data,
              options,
              plugins: [releaseMarkers],
            });
          }

          function renderBenchSet(name, benchSet, main) {
            const setElem = document.createElement('div');
            setElem.className = 'benchmark-set';
            main.appendChild(setElem);

            const nameElem = document.createElement('h1');
            nameElem.className = 'benchmark-title';
            nameElem.textContent = name;
            setElem.appendChild(nameElem);

            const graphsElem = document.createElement('div');
            graphsElem.className = 'benchmark-graphs';
            setElem.appendChild(graphsElem);

            for (const [benchName, benches] of benchSet.entries()) {
              renderGraph(graphsElem, benchName, benches, name)
            }
          }

          const main = document.getElementById('main');
          for (const {name, dataSet} of dataSets) {
            renderBenchSet(name, dataSet, main);
          }
        }

        renderAllChars(init()); // Start
      })();
    </script>
  </body>
</html>
