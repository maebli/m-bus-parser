[package]
name = "m-bus-website-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
parser = ["dep:m-bus-parser", "m-bus-parser/oms-gen5", "dep:serde-wasm-bindgen", "dep:serde_json", "dep:serde", "decryption-mode-7", "decryption-mode-10", "decryption-mode-13"]
decryption-mode-7 = ["m-bus-parser/decryption-mode-7"]
decryption-mode-10 = ["m-bus-parser/decryption-mode-10"]
decryption-mode-13 = ["m-bus-parser/decryption-mode-13"]
syntax = ["dep:syntect"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
js-sys = "0.3"
wasm-bindgen = "0.2.84"
serde-wasm-bindgen = { version = "0.6", optional = true }
m-bus-parser = { path = "../..", features = ["std", "serde", "decryption"], optional = true }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"], optional = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]

[dev-dependencies]
wasm-bindgen-test = "0.3.34"
