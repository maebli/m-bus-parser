[package]
name = "pymbusparser"
version = "0.7.4"
edition = "2021"
homepage = "https://maebli.github.io/"
repository = "https://github.com/maebli/m-bus-parser"
description = "A Python binding for the M-Bus parser"
license = "MIT"

[features]
oms-gen2 = ["decryption-mode-5", "m-bus-parser/oms-gen2"]
oms-gen3 = ["oms-gen2", "m-bus-parser/oms-gen3"]
oms-gen4-0 = ["oms-gen3", "decryption-mode-7", "decryption-mode-13", "m-bus-parser/oms-gen4-0"]
oms-gen4-1 = ["oms-gen4-0", "m-bus-parser/oms-gen4-1"]
oms-gen4-2 = ["oms-gen4-1", "m-bus-parser/oms-gen4-2"]
oms-gen4-3 = ["oms-gen4-2", "m-bus-parser/oms-gen4-3"]
oms-gen4-4 = ["oms-gen4-3", "m-bus-parser/oms-gen4-4"]
oms-gen4-5 = ["oms-gen4-4", "decryption-mode-10", "m-bus-parser/oms-gen4-5"]
oms-gen4 = ["oms-gen4-5", "m-bus-parser/oms-gen4"]
oms-gen5 = ["oms-gen4-5", "m-bus-parser/oms-gen5"]
default = ["decryption"]
decryption = ["decryption-mode-5", "decryption-mode-7", "decryption-mode-10", "decryption-mode-13"]
decryption-api = ["m-bus-parser/decryption-api"]
decryption-mode-5 = ["decryption-api", "m-bus-parser/decryption-mode-5"]
decryption-mode-7 = ["decryption-api", "m-bus-parser/decryption-mode-7"]
decryption-mode-10 = ["decryption-api", "m-bus-parser/decryption-mode-10"]
decryption-mode-13 = ["decryption-api", "m-bus-parser/decryption-mode-13"]

[dependencies]
m-bus-parser = { path = "..", version = "0.7.4", features = ["std", "serde"] }
serde_json = "1.0"
pyo3 = { version = "0.30.1", features = ["extension-module", "generate-import-lib"] }
hex = "0.4"

[lib]
name = "pymbusparser"
crate-type = ["cdylib"]

[package.metadata.release]
tag-name = "python-v{{version}}"
