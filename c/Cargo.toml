[package]
name = "m-bus-parser-c"
version = "0.7.4"
edition = "2021"
description = "C bindings for the M-Bus parser"
license = "MIT"
repository = "https://github.com/maebli/m-bus-parser"
publish = false

[lib]
name = "mbus_parser"
crate-type = ["cdylib", "staticlib"]

[dependencies]
m-bus-parser = { path = "..", version = "0.7.4", features = ["std", "serde", "decryption"] }
serde_json = "1.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "allow"
