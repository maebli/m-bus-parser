name: Java bindings

on:
  push:
    branches: [main]
    tags: ['java-v*']
    paths: ['java/**', 'c/**', 'src/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/java.yml']
  pull_request:
    paths: ['java/**', 'c/**', 'src/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/java.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build binding and run the packaged example
        run: mvn --batch-mode --no-transfer-progress -f java/pom.xml verify
      - uses: actions/upload-artifact@v7
        with:
          name: java-native-${{ matrix.runner }}
          path: java/target/native-resources/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/java-v')
    needs: build
    runs-on: ubuntu-24.04
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: java-native-*
          merge-multiple: true
          path: java/target/native-resources
      - name: Publish signed Java and native artifacts to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -f java/pom.xml -Prelease -Dnative.prebuilt=true deploy
