[package]
name = "m-bus-libmbus-comparison"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
m-bus-parser = { path = "../..", features = ["std", "plaintext-before-extension"] }

[dev-dependencies]
criterion = { version = "0.8.1", default-features = false }
hex = "0.4"
serde_json = "1.0"

[build-dependencies]
cc = "=1.2.10"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1

[[bench]]
name = "comparison"
harness = false
