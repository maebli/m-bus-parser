name: Benchmarks and site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Publishing reads, updates and re-uploads a single history file, so runs on
  # the same ref must queue rather than overlap.
  group: parser-resources-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCH_HISTORY_TAG: bench-history

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PARSER_RESOURCES_TOOLCHAIN: nightly-2026-05-16
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Remove email addresses from benchmark metadata
        shell: bash
        run: |
          # github-action-benchmark serializes head_commit into its output and logs.
          sanitized_event="${RUNNER_TEMP}/github-event-sanitized.json"
          jq 'walk(if type == "object" then del(.email) else . end)' \
            "$GITHUB_EVENT_PATH" > "$sanitized_event"
          cp "$sanitized_event" "$GITHUB_EVENT_PATH"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-16
          components: llvm-tools-preview
          targets: thumbv7em-none-eabi
      - name: Check benchmark chart comparisons
        run: node --test .github/scripts/test-bench-charts.cjs
      - name: Check corpus metric conversion
        run: python3 -m unittest discover -s benches -p 'test_measure_corpus.py'
      - name: Check corpus benchmark workloads
        run: |
          cargo +nightly-2026-05-16 bench --locked --bench corpus -- --test
          cargo +nightly-2026-05-16 bench --locked --bench corpus --features std,plaintext-before-extension -- --test
      - name: Measure parser resources
        run: python3 benches/parser-resources/measure.py --output parser-resources.json
      - name: Compare speed and size optimization
        run: python3 benches/parser-resources/compare.py --output optimization-comparison.json
      - name: Install embedded comparison tools
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/arm-gnu-toolchain"
          mkdir -p "$toolchain"
          curl -fsSL --retry 3 https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          echo "62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  $RUNNER_TEMP/arm-toolchain.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/arm-toolchain.tar.xz" --strip-components=1 -C "$toolchain"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
      - name: Measure corpus and libmbus
        run: python3 benches/measure-corpus.py --output corpus-benchmarks.json --details corpus-benchmarks-details.json
      - name: Check measured corpus charts
        run: BENCH_CORPUS_JSON=corpus-benchmarks.json node --test .github/scripts/test-bench-charts.cjs
      - name: Measure decode speed
        run: |
          set -o pipefail
          cargo +nightly-2026-05-16 bench --locked --bench bench -- \
            parse_full_frame_eager --exact --noplot --discard-baseline \
            --output-format bencher \
            --sample-size 50 --warm-up-time 1 --measurement-time 3 \
            --nresamples 10000 2>&1 | tee decode-speed.txt
      - name: Restore benchmark history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/restore-benchmark-history.sh
      - name: Summarize parser resources
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Parser stack and footprint
          tool: customSmallerIsBetter
          output-file-path: parser-resources.json
          external-data-json-path: ./cache/benchmark-data.json
          summary-always: true
          max-items-in-chart: 100
      - name: Summarize decode speed
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Parser decode speed
          tool: cargo
          output-file-path: decode-speed.txt
          external-data-json-path: ./cache/benchmark-data.json
          summary-always: true
          max-items-in-chart: 100
      - name: Summarize optimization comparison
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Parser optimization comparison
          tool: customSmallerIsBetter
          output-file-path: optimization-comparison.json
          external-data-json-path: ./cache/benchmark-data.json
          summary-always: true
          max-items-in-chart: 100
      - name: Summarize corpus and libmbus
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Parser library comparison
          tool: customSmallerIsBetter
          output-file-path: corpus-benchmarks.json
          external-data-json-path: ./cache/benchmark-data.json
          summary-always: true
          max-items-in-chart: 100
      - name: Upload measurement
        uses: actions/upload-artifact@v4
        with:
          name: parser-resources
          path: |
            parser-resources.json
            decode-speed.txt
            optimization-comparison.json
            corpus-benchmarks.json
            corpus-benchmarks-details.json
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release markers on the charts need the full history and all tags.
          fetch-depth: 0
      - name: Remove email addresses from benchmark metadata
        shell: bash
        run: |
          # github-action-benchmark serializes head_commit into public data.js.
          sanitized_event="${RUNNER_TEMP}/github-event-sanitized.json"
          jq 'walk(if type == "object" then del(.email) else . end)' \
            "$GITHUB_EVENT_PATH" > "$sanitized_event"
          cp "$sanitized_event" "$GITHUB_EVENT_PATH"
      - name: Download measurement
        uses: actions/download-artifact@v4
        with:
          name: parser-resources
      - name: Restore benchmark history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/restore-benchmark-history.sh
      - name: Append parser resources to history
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Parser stack and footprint
          tool: customSmallerIsBetter
          output-file-path: parser-resources.json
          external-data-json-path: ./cache/benchmark-data.json
          alert-threshold: '105%'
          fail-threshold: '110%'
          fail-on-alert: true
          summary-always: true
          max-items-in-chart: 100
      - name: Append decode speed to history
        if: ${{ !cancelled() }}
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Parser decode speed
          tool: cargo
          output-file-path: decode-speed.txt
          external-data-json-path: ./cache/benchmark-data.json
          alert-threshold: '125%'
          summary-always: true
          max-items-in-chart: 100
      - name: Append optimization comparison to history
        if: ${{ !cancelled() }}
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Parser optimization comparison
          tool: customSmallerIsBetter
          output-file-path: optimization-comparison.json
          external-data-json-path: ./cache/benchmark-data.json
          summary-always: true
          max-items-in-chart: 100
      - name: Append corpus and libmbus to history
        if: ${{ !cancelled() }}
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Parser library comparison
          tool: customSmallerIsBetter
          output-file-path: corpus-benchmarks.json
          external-data-json-path: ./cache/benchmark-data.json
          summary-always: true
          max-items-in-chart: 100
      - name: Persist benchmark history
        # A regression must still be recorded, so this runs even when an
        # earlier step failed the alert threshold.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$BENCH_HISTORY_TAG" >/dev/null 2>&1; then
            gh release create "$BENCH_HISTORY_TAG" \
              --title "Benchmark history" \
              --notes "Storage for benchmark history plotted at ${{ github.server_url }}/${{ github.repository }}/dev/bench. Not a source release." \
              --latest=false
          fi
          gh release upload "$BENCH_HISTORY_TAG" cache/benchmark-data.json --clobber
      - name: Render benchmark page data
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/render-bench-page.py
          cp corpus-benchmarks.json corpus-benchmarks-details.json docs/dev/bench/
      - name: Set up Rust
        if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm for the site
        if: ${{ !cancelled() }}
        run: |
          cd wasm
          wasm-pack build --target web --out-dir pkg-web
      - name: Stage wasm artifacts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cp wasm/pkg-web/m_bus_parser_wasm_pack.js docs/
          cp wasm/pkg-web/m_bus_parser_wasm_pack_bg.wasm docs/
          if [ -f wasm/pkg-web/m_bus_parser_wasm_pack_bg.js ]; then
            cp wasm/pkg-web/m_bus_parser_wasm_pack_bg.js docs/
          fi
          # The site cache-busts wasm by query string; pin it to this commit so
          # browsers pick up each rebuild.
          sed -i "s/?v=[0-9A-Za-z._-]*\"/?v=${GITHUB_SHA:0:7}\"/g" docs/index.html
      - name: Upload site artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        if: ${{ !cancelled() }}
        id: deployment
        uses: actions/deploy-pages@v4
