[package]
name = "pymbusparser"
version = "0.7.0"
edition = "2021"
homepage = "https://maebli.github.io/"
repository = "https://github.com/maebli/m-bus-parser"
description = "A Python binding for the M-Bus parser"
license = "MIT"

[features]
default = ["decryption"]
decryption = ["decryption-mode-5", "decryption-mode-7", "decryption-mode-10", "decryption-mode-13"]
decryption-api = ["m-bus-parser/decryption-api"]
decryption-mode-5 = ["decryption-api", "m-bus-parser/decryption-mode-5"]
decryption-mode-7 = ["decryption-api", "m-bus-parser/decryption-mode-7"]
decryption-mode-10 = ["decryption-api", "m-bus-parser/decryption-mode-10"]
decryption-mode-13 = ["decryption-api", "m-bus-parser/decryption-mode-13"]

[dependencies]
m-bus-parser = { path = "..", version = "0.7.0", features = ["std", "serde"] }
serde_json = "1.0"
pyo3 = { version = "0.30.1", features = ["extension-module", "generate-import-lib"] }
hex = "0.4"

[lib]
name = "pymbusparser"
crate-type = ["cdylib"]

[package.metadata.release]
tag-name = "python-v{{version}}"
