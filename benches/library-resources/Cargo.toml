[package]
name = "m-bus-library-resources"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
m-bus-parser = { path = "../..", features = ["plaintext-before-extension"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
